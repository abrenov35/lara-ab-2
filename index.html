<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LARA v2</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial; background: #f5f5f5; color: #333; }
    .container { max-width: 900px; margin: 20px auto; padding: 20px; }
    header { background: #0d3a66; color: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 24px; }
    header p { font-size: 13px; opacity: 0.9; }
    .btn { background: #185fa5; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .btn:hover { background: #0d3a66; }
    .section { background: white; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 20px; }
    .section-title { background: #0d3a66; color: white; padding: 12px; font-weight: bold; }
    .section-content { padding: 15px; }
    .doc { background: #f9f9f9; border: 1px solid #eee; padding: 12px; margin-bottom: 10px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
    .doc-info { flex: 1; }
    .doc-name { font-weight: bold; }
    .doc-meta { font-size: 12px; color: #666; }
    .doc-btn { background: #2e7d46; padding: 6px 12px; margin-left: 8px; font-size: 12px; color: white; text-decoration: none; border-radius: 4px; }
    .empty { text-align: center; color: #999; padding: 20px; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 1000; }
    .modal.active { display: flex; }
    .modal-box { background: white; padding: 30px; border-radius: 8px; width: 90%; max-width: 400px; }
    .modal-box h2 { margin-bottom: 15px; }
    .modal-box input, .modal-box select, .modal-box textarea { width: 100%; padding: 8px; margin: 8px 0; border: 1px solid #ddd; border-radius: 4px; font-family: inherit; }
    .modal-box button { width: 100%; padding: 10px; margin: 8px 0; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .btn-submit { background: #2e7d46; color: white; }
    .btn-cancel { background: #999; color: white; }
    .msg { position: fixed; top: 20px; right: 20px; padding: 15px 20px; border-radius: 6px; color: white; z-index: 2000; animation: slide 0.3s; }
    .msg.ok { background: #2e7d46; }
    .msg.err { background: #b3352c; }
    @keyframes slide { from { transform: translateX(400px); } to { transform: translateX(0); } }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div><h1>📋 LARA</h1><p>Gestion Documentaire de Chantier</p></div>
    <button class="btn" onclick="openAdd()">+ Ajouter</button>
  </header>

  <div class="section">
    <div class="section-title">📸 Photos</div>
    <div class="section-content" id="photos"><div class="empty">Aucune photo</div></div>
  </div>

  <div class="section">
    <div class="section-title">📐 Plans</div>
    <div class="section-content" id="plans"><div class="empty">Aucun plan</div></div>
  </div>

  <div class="section">
    <div class="section-title">✅ Documents</div>
    <div class="section-content" id="docs"><div class="empty">Aucun document</div></div>
  </div>
</div>

<div class="modal" id="modal">
  <div class="modal-box">
    <h2>+ Ajouter un Document</h2>
    <select id="cat" required>
      <option value="">-- Catégorie --</option>
      <option value="📸 Photos">📸 Photos</option>
      <option value="📐 Plans">📐 Plans</option>
      <option value="✅ Documents">✅ Documents</option>
    </select>
    <input type="date" id="date" required>
    <input type="file" id="file" required>
    <input type="text" id="desc" placeholder="Description (optionnel)">
    <button class="btn-submit" onclick="upload()">Ajouter</button>
    <button class="btn-cancel" onclick="closeAdd()">Annuler</button>
  </div>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbxsda_fhVSpXZuOkSHGRGVOeHfOalkWPil22nsT_TMcaBQK-cQeX2Pn8O1g5oBRPqIV/exec";
let docs = { "📸 Photos": [], "📐 Plans": [], "✅ Documents": [] };

function openAdd() { document.getElementById("modal").classList.add("active"); }
function closeAdd() { document.getElementById("modal").classList.remove("active"); }
function msg(text, ok) {
  let m = document.createElement("div");
  m.className = "msg " + (ok ? "ok" : "err");
  m.textContent = text;
  document.body.appendChild(m);
  setTimeout(() => m.remove(), 3000);
}

async function load() {
  try {
    let r = await fetch(API);
    let j = await r.json();
    if (j.ok && j.data) {
      docs = { "📸 Photos": [], "📐 Plans": [], "✅ Documents": [] };
      j.data.forEach(d => { if (docs[d.cat]) docs[d.cat].push(d); });
      render();
    }
  } catch (e) { console.error(e); }
}

async function upload() {
  let cat = document.getElementById("cat").value;
  let date = document.getElementById("date").value;
  let file = document.getElementById("file").files[0];
  let desc = document.getElementById("desc").value;
  
  if (!cat || !date || !file) { msg("Remplissez tous les champs", false); return; }
  
  let reader = new FileReader();
  reader.onload = async (e) => {
    let data = e.target.result.split(",")[1];
    try {
      let r = await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({ cat, name: file.name, date, desc, file: data })
      });
      let j = await r.json();
      if (j.ok) {
        msg("✅ Document ajouté", true);
        closeAdd();
        setTimeout(load, 500);
      } else {
        msg("❌ " + j.msg, false);
      }
    } catch (e) {
      msg("❌ Erreur: " + e, false);
    }
  };
  reader.readAsDataURL(file);
}

function render() {
  ["📸 Photos", "📐 Plans", "✅ Documents"].forEach(cat => {
    let html = "";
    if (docs[cat].length === 0) {
      html = '<div class="empty">Aucun document</div>';
    } else {
      docs[cat].forEach(d => {
        html += `<div class="doc"><div class="doc-info"><div class="doc-name">${d.name}</div><div class="doc-meta">${d.date || ""} ${d.desc || ""}</div></div><a href="${d.url}" target="_blank" class="btn doc-btn">👁️ Voir</a></div>`;
      });
    }
    document.getElementById(cat === "📸 Photos" ? "photos" : cat === "📐 Plans" ? "plans" : "docs").innerHTML = html;
  });
}

document.getElementById("date").valueAsDate = new Date();
load();
</script>

</body>
</html>
